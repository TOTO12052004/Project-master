<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChatOnline - Profile Saya</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styleforprofile.css" />
  </head>

  <body>
    <div class="profile-app">
      <aside class="profile-panel">
        <header class="profile-panel-header">
          <button class="icon-button" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i>
          </button>

          <h5>Profile</h5>
        </header>

        <div class="profile-photo-section">
          <div class="profile-photo-wrapper">
            <img
              src="https://i.pravatar.cc/200?img=12"
              alt="Foto Profile"
              class="profile-photo-large"
            />

            <button class="photo-edit-button">
              <i class="bi bi-camera-fill"></i>
            </button>
          </div>
        </div>

        <div class="profile-field">
          <label>Nama</label>

          <div class="profile-field-value">
            <span>Rangga Adi Pratama</span>

            <button class="icon-button">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
        </div>

        <div class="profile-field">
          <label>Status</label>

          <div class="profile-field-value">
            <span>Sibuk kerja, chat aja santai 😄</span>

            <button class="icon-button">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
        </div>

        <div class="profile-field">
          <label>Nomor Telepon</label>

          <div class="profile-field-value">
            <span>+62 812-3456-7890</span>
          </div>
        </div>

        <div class="profile-field">
          <label>Email</label>

          <div class="profile-field-value">
            <span>rangga.pratama@email.com</span>
          </div>
        </div>

        <div class="profile-footer-note">
          <i class="bi bi-info-circle"></i>
          Informasi ini akan terlihat oleh kontak yang sudah kamu tambahkan.
        </div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
